name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # React Doctor compares against the base branch to report only new issues, and a shallow
        # checkout has no merge base to compare with.
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # why: doctor.config.ts loads the lint plugin, which imports vite-plus. Without node_modules
      # React Doctor fails to load the config, says so in one log line, and scans with its
      # defaults: no ignored files and no rodeo rules.
      - name: Install dependencies
        run: npm ci

      - name: Read React Doctor version
        id: doctor-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['react-doctor']")" >> "$GITHUB_OUTPUT"

      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2
        with:
          # why: the action's blocking input defaults to none and is passed as a flag, which overrides doctor.config.ts.
          blocking: warning
          version: ${{ steps.doctor-version.outputs.version }}
